<title>Sales Performance Leaderboard</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
:root {
  /* Layout: Gamified leaderboard with real-time rankings and achievement badges */
  --bg: #0f172a;
  --surface: #1e293b;
  --surface-elevated: #334155;
  --border: #475569;
  --text-primary: #f1f5f9;
  --text-secondary: #cbd5e1;
  --text-muted: #64748b;
  --gold: #fbbf24;
  --gold-bg: #78350f;
  --silver: #94a3b8;
  --silver-bg: #334155;
  --bronze: #ea580c;
  --bronze-bg: #7c2d12;
  --accent: #8b5cf6;
  --accent-bg: #4c1d95;
  --success: #10b981;
  --success-bg: #064e3b;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #ffffff;
    --surface: #f8fafc;
    --surface-elevated: #ffffff;
    --border: #e2e8f0;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --gold: #f59e0b;
    --gold-bg: #fef3c7;
    --silver: #64748b;
    --silver-bg: #e2e8f0;
    --bronze: #ea580c;
    --bronze-bg: #fed7aa;
    --accent: #8b5cf6;
    --accent-bg: #ede9fe;
    --success: #10b981;
    --success-bg: #d1fae5;
    color-scheme: light;
  }
}

:root[data-theme="light"] {
  --bg: #ffffff;
  --surface: #f8fafc;
  --surface-elevated: #ffffff;
  --border: #e2e8f0;
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  --gold: #f59e0b;
  --gold-bg: #fef3c7;
  --silver: #64748b;
  --silver-bg: #e2e8f0;
  --bronze: #ea580c;
  --bronze-bg: #fed7aa;
  --accent: #8b5cf6;
  --accent-bg: #ede9fe;
  --success: #10b981;
  --success-bg: #d1fae5;
  color-scheme: light;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
}

.header {
  text-align: center;
  margin-bottom: 40px;
}

.header h1 {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 12px;
  text-wrap: balance;
}

.trophy {
  font-size: 48px;
  animation: bounce 2s infinite;
}

@keyframes bounce {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-10px);
  }
}

.period-selector {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 32px;
  flex-wrap: wrap;
}

.period-btn {
  padding: 10px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-primary);
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.period-btn:hover {
  background: var(--surface-elevated);
  border-color: var(--accent);
}

.period-btn.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.podium {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 40px;
  align-items: end;
}

.podium-place {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  text-align: center;
  position: relative;
  transition: transform 0.3s;
}

.podium-place:hover {
  transform: translateY(-4px);
}

.podium-place.first {
  border-color: var(--gold);
  order: 2;
}

.podium-place.second {
  border-color: var(--silver);
  order: 1;
}

.podium-place.third {
  border-color: var(--bronze);
  order: 3;
}

.rank-badge {
  position: absolute;
  top: -16px;
  left: 50%;
  transform: translateX(-50%);
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: 700;
  border: 3px solid var(--bg);
}

.rank-badge.first {
  background: var(--gold);
  color: var(--gold-bg);
}

.rank-badge.second {
  background: var(--silver);
  color: var(--silver-bg);
}

.rank-badge.third {
  background: var(--bronze);
  color: white;
}

.avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--accent-bg);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: 700;
  margin: 20px auto 16px;
}

.agent-name {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 8px;
}

.agent-stats {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 16px;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
}

.stat-label {
  color: var(--text-muted);
}

.stat-value {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.leaderboard-table {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 32px;
}

.leaderboard-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
}

.leaderboard-title {
  font-size: 20px;
  font-weight: 700;
}

.table-row {
  display: grid;
  grid-template-columns: 60px 1fr 120px 120px 120px;
  gap: 16px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  align-items: center;
  transition: background 0.2s;
}

.table-row:last-child {
  border-bottom: none;
}

.table-row:hover {
  background: var(--surface-elevated);
}

.table-header {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  background: var(--surface-elevated);
}

.rank-cell {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-muted);
  text-align: center;
}

.agent-cell {
  display: flex;
  align-items: center;
  gap: 12px;
}

.agent-avatar-small {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--accent-bg);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  flex-shrink: 0;
}

.agent-info {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.agent-name-small {
  font-weight: 600;
  font-size: 14px;
}

.agent-badge {
  font-size: 11px;
  color: var(--text-muted);
}

.stat-cell {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  text-align: right;
}

.achievements {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
}

.achievements h2 {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 20px;
}

.achievement-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
}

.achievement-card {
  background: var(--surface-elevated);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  transition: transform 0.2s;
}

.achievement-card:hover {
  transform: scale(1.05);
}

.achievement-icon {
  font-size: 40px;
  margin-bottom: 12px;
}

.achievement-name {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 4px;
}

.achievement-desc {
  font-size: 12px;
  color: var(--text-muted);
}

@media (max-width: 768px) {
  .podium {
    grid-template-columns: 1fr;
  }

  .podium-place.first,
  .podium-place.second,
  .podium-place.third {
    order: initial;
  }

  .table-row {
    grid-template-columns: 40px 1fr 80px;
    gap: 12px;
  }

  .stat-cell:nth-child(4),
  .stat-cell:nth-child(5) {
    display: none;
  }

  .table-header .stat-cell:nth-child(4),
  .table-header .stat-cell:nth-child(5) {
    display: none;
  }
}
</style>

<div class="container">
  <div class="header">
    <div class="trophy">🏆</div>
    <h1>Sales Performance Leaderboard</h1>
    <p style="color: var(--text-secondary); margin-top: 8px;">Top performers ranked by deals closed and revenue generated</p>
  </div>

  <div class="period-selector">
    <button class="period-btn" data-period="today">Today</button>
    <button class="period-btn active" data-period="week">This Week</button>
    <button class="period-btn" data-period="month">This Month</button>
    <button class="period-btn" data-period="quarter">This Quarter</button>
    <button class="period-btn" data-period="all">All Time</button>
  </div>

  <div class="podium" id="podium">
    <!-- Top 3 will be populated by JavaScript -->
  </div>

  <div class="leaderboard-table">
    <div class="leaderboard-header">
      <div class="leaderboard-title">Full Rankings</div>
    </div>
    <div class="table-row table-header">
      <div class="rank-cell">Rank</div>
      <div>Agent</div>
      <div class="stat-cell">Deals</div>
      <div class="stat-cell">Revenue</div>
      <div class="stat-cell">Conv Rate</div>
    </div>
    <div id="leaderboardBody">
      <!-- Rows will be populated by JavaScript -->
    </div>
  </div>

  <div class="achievements">
    <h2>🎖️ Recent Achievements</h2>
    <div class="achievement-grid" id="achievements">
      <!-- Achievements will be populated by JavaScript -->
    </div>
  </div>
</div>

<script>
const agents = [
  { name: 'Sarah Chen', deals: 28, revenue: 485000, calls: 142, conversion: 19.7 },
  { name: 'Michael Chang', deals: 24, revenue: 420000, calls: 156, conversion: 15.4 },
  { name: 'John Smith', deals: 22, revenue: 395000, calls: 138, conversion: 15.9 },
  { name: 'Emily Rodriguez', deals: 19, revenue: 345000, calls: 128, conversion: 14.8 },
  { name: 'David Kim', deals: 17, revenue: 298000, calls: 145, conversion: 11.7 },
  { name: 'Jennifer Lee', deals: 15, revenue: 275000, calls: 112, conversion: 13.4 },
  { name: 'Robert Taylor', deals: 13, revenue: 245000, calls: 98, conversion: 13.3 },
  { name: 'Lisa Anderson', deals: 11, revenue: 198000, calls: 89, conversion: 12.4 }
];

const achievements = [
  { icon: '🔥', name: 'Hot Streak', desc: 'Sarah Chen: 5 deals in one day', agent: 'Sarah Chen' },
  { icon: '💰', name: 'Big Deal', desc: 'Michael Chang: $55K deal closed', agent: 'Michael Chang' },
  { icon: '🎯', name: 'Perfect Week', desc: 'John Smith: 100% callback success', agent: 'John Smith' },
  { icon: '⚡', name: 'Speed Demon', desc: 'Emily Rodriguez: 50 calls in one day', agent: 'Emily Rodriguez' },
  { icon: '🌟', name: 'Rising Star', desc: 'David Kim: +40% improvement this month', agent: 'David Kim' },
  { icon: '👑', name: 'Top Closer', desc: 'Sarah Chen: #1 conversion rate', agent: 'Sarah Chen' }
];

function getInitials(name) {
  return name.split(' ').map(n => n[0]).join('');
}

function formatCurrency(amount) {
  return '$' + (amount / 1000).toFixed(0) + 'K';
}

function renderPodium() {
  const podium = document.getElementById('podium');
  const topThree = agents.slice(0, 3);
  const places = ['first', 'second', 'third'];
  const medals = ['🥇', '🥈', '🥉'];

  podium.innerHTML = topThree.map((agent, i) => `
    <div class="podium-place ${places[i]}">
      <div class="rank-badge ${places[i]}">${medals[i]}</div>
      <div class="avatar">${getInitials(agent.name)}</div>
      <div class="agent-name">${agent.name}</div>
      <div class="agent-stats">
        <div class="stat-row">
          <span class="stat-label">Deals Closed</span>
          <span class="stat-value">${agent.deals}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Revenue</span>
          <span class="stat-value">${formatCurrency(agent.revenue)}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Conversion</span>
          <span class="stat-value">${agent.conversion}%</span>
        </div>
      </div>
    </div>
  `).join('');
}

function renderLeaderboard() {
  const body = document.getElementById('leaderboardBody');
  body.innerHTML = agents.map((agent, i) => `
    <div class="table-row">
      <div class="rank-cell">${i + 1}</div>
      <div class="agent-cell">
        <div class="agent-avatar-small">${getInitials(agent.name)}</div>
        <div class="agent-info">
          <div class="agent-name-small">${agent.name}</div>
          <div class="agent-badge">${agent.calls} calls made</div>
        </div>
      </div>
      <div class="stat-cell">${agent.deals}</div>
      <div class="stat-cell">${formatCurrency(agent.revenue)}</div>
      <div class="stat-cell">${agent.conversion}%</div>
    </div>
  `).join('');
}

function renderAchievements() {
  const grid = document.getElementById('achievements');
  grid.innerHTML = achievements.map(ach => `
    <div class="achievement-card">
      <div class="achievement-icon">${ach.icon}</div>
      <div class="achievement-name">${ach.name}</div>
      <div class="achievement-desc">${ach.desc}</div>
    </div>
  `).join('');
}

// Period selector
document.querySelectorAll('.period-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    // In production, this would fetch different period data
  });
});

// Initial render
renderPodium();
renderLeaderboard();
renderAchievements();
</script>
