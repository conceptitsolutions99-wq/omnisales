<title>OmniSales Live Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Design Tokens */
:root {
  /* Layout: Real-time metrics grid with interactive filters */
  --bg: #ffffff;
  --surface: #f8fafc;
  --border: #e2e8f0;
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  --accent: #3b82f6;
  --accent-bg: #eff6ff;
  --success: #10b981;
  --success-bg: #d1fae5;
  --warning: #f59e0b;
  --warning-bg: #fef3c7;
  --danger: #ef4444;
  --danger-bg: #fee2e2;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --text-primary: #f1f5f9;
    --text-secondary: #cbd5e1;
    --text-muted: #64748b;
    --accent: #60a5fa;
    --accent-bg: #1e3a8a;
    --success: #34d399;
    --success-bg: #064e3b;
    --warning: #fbbf24;
    --warning-bg: #78350f;
    --danger: #f87171;
    --danger-bg: #7f1d1d;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1e293b;
  --border: #334155;
  --text-primary: #f1f5f9;
  --text-secondary: #cbd5e1;
  --text-muted: #64748b;
  --accent: #60a5fa;
  --accent-bg: #1e3a8a;
  --success: #34d399;
  --success-bg: #064e3b;
  --warning: #fbbf24;
  --warning-bg: #78350f;
  --danger: #f87171;
  --danger-bg: #7f1d1d;
  color-scheme: dark;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
}

.header {
  margin-bottom: 32px;
}

.header h1 {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 8px;
  text-wrap: balance;
}

.header p {
  color: var(--text-secondary);
  font-size: 15px;
}

.theme-toggle {
  position: fixed;
  top: 24px;
  right: 24px;
  padding: 8px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text-primary);
  transition: all 0.2s;
}

.theme-toggle:hover {
  background: var(--accent-bg);
  border-color: var(--accent);
}

.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}

.metric-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
}

.metric-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.metric-value {
  font-size: 36px;
  font-weight: 700;
  margin-bottom: 8px;
  font-variant-numeric: tabular-nums;
}

.metric-change {
  font-size: 13px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  border-radius: 6px;
}

.metric-change.positive {
  color: var(--success);
  background: var(--success-bg);
}

.metric-change.negative {
  color: var(--danger);
  background: var(--danger-bg);
}

.chart-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 24px;
}

.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
  gap: 16px;
}

.chart-title {
  font-size: 18px;
  font-weight: 600;
}

.filters {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.filter-btn {
  padding: 8px 16px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-secondary);
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.filter-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.filter-btn.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.chart {
  position: relative;
  height: 300px;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 16px 0;
}

.bar-group {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.bar {
  width: 100%;
  background: var(--accent);
  border-radius: 4px 4px 0 0;
  transition: all 0.3s;
  cursor: pointer;
  position: relative;
}

.bar:hover {
  opacity: 0.8;
}

.bar-label {
  font-size: 12px;
  color: var(--text-muted);
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.legend {
  display: flex;
  gap: 24px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
}

.legend-marker {
  width: 12px;
  height: 12px;
  border-radius: 3px;
}

.activity-feed {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
}

.activity-item {
  display: flex;
  gap: 16px;
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
}

.activity-item:last-child {
  border-bottom: none;
}

.activity-icon {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 18px;
}

.activity-icon.success {
  background: var(--success-bg);
  color: var(--success);
}

.activity-icon.warning {
  background: var(--warning-bg);
  color: var(--warning);
}

.activity-icon.info {
  background: var(--accent-bg);
  color: var(--accent);
}

.activity-content {
  flex: 1;
  min-width: 0;
}

.activity-title {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 4px;
}

.activity-details {
  font-size: 13px;
  color: var(--text-secondary);
}

.activity-time {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
}

.pulse {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--success);
  animation: pulse 2s infinite;
  margin-right: 8px;
}

@keyframes pulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.5;
  }
}

@media (max-width: 768px) {
  .metrics-grid {
    grid-template-columns: 1fr;
  }

  .chart-header {
    flex-direction: column;
    align-items: flex-start;
  }

  .chart {
    height: 250px;
  }
}
</style>

<div class="container">
  <button class="theme-toggle" onclick="toggleTheme()">🌓 Toggle Theme</button>

  <div class="header">
    <h1><span class="pulse"></span>OmniSales Live Dashboard</h1>
    <p>Real-time sales performance metrics for Canada & USA IT solutions outbound sales</p>
  </div>

  <div class="metrics-grid" id="metricsGrid">
    <!-- Metrics will be populated by JavaScript -->
  </div>

  <div class="chart-section">
    <div class="chart-header">
      <h2 class="chart-title">Call Outcomes Distribution</h2>
      <div class="filters">
        <button class="filter-btn active" data-period="7d">7 Days</button>
        <button class="filter-btn" data-period="30d">30 Days</button>
        <button class="filter-btn" data-period="90d">90 Days</button>
        <button class="filter-btn" data-period="all">All Time</button>
      </div>
    </div>
    <div class="chart" id="outcomeChart">
      <!-- Chart will be populated by JavaScript -->
    </div>
    <div class="legend">
      <div class="legend-item">
        <div class="legend-marker" style="background: #10b981;"></div>
        <span>Deal Completed</span>
      </div>
      <div class="legend-item">
        <div class="legend-marker" style="background: #3b82f6;"></div>
        <span>Considering</span>
      </div>
      <div class="legend-item">
        <div class="legend-marker" style="background: #f59e0b;"></div>
        <span>Call Back Later</span>
      </div>
      <div class="legend-item">
        <div class="legend-marker" style="background: #ef4444;"></div>
        <span>Denied</span>
      </div>
    </div>
  </div>

  <div class="activity-feed">
    <h2 class="chart-title" style="margin-bottom: 16px;">Recent Activity</h2>
    <div id="activityFeed">
      <!-- Activity items will be populated by JavaScript -->
    </div>
  </div>
</div>

<script>
function toggleTheme() {
  const root = document.documentElement;
  const current = root.getAttribute('data-theme');
  const newTheme = current === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', newTheme);
  try {
    localStorage.setItem('omnisales-theme', newTheme);
  } catch (e) {}
}

// Load saved theme
try {
  const savedTheme = localStorage.getItem('omnisales-theme');
  if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
  }
} catch (e) {}

// Simulate real-time data (in production, this would connect to your API)
function generateDashboardData() {
  return {
    totalCalls: Math.floor(Math.random() * 50) + 150,
    dealsCompleted: Math.floor(Math.random() * 20) + 35,
    conversionRate: (Math.random() * 10 + 20).toFixed(1),
    pipelineValue: Math.floor(Math.random() * 100000) + 450000,
    outcomeData: [
      { label: 'Deal Completed', value: Math.floor(Math.random() * 20) + 30, color: '#10b981' },
      { label: 'Considering', value: Math.floor(Math.random() * 30) + 40, color: '#3b82f6' },
      { label: 'Call Back', value: Math.floor(Math.random() * 15) + 20, color: '#f59e0b' },
      { label: 'Denied', value: Math.floor(Math.random() * 20) + 25, color: '#ef4444' }
    ],
    recentActivity: [
      { icon: '✅', type: 'success', title: 'Deal Closed', details: 'Sarah Chen closed $45,000 deal with Nova Scotia Marine Tech', time: '2 min ago' },
      { icon: '📞', type: 'info', title: 'Call Completed', details: 'Michael Chang marked call as "Considering" - Follow-up scheduled', time: '8 min ago' },
      { icon: '🎯', type: 'warning', title: 'High-Value Lead', details: 'New lead generated: Silicon Valley Cloud Security ($55,000)', time: '15 min ago' },
      { icon: '✅', type: 'success', title: 'Deal Closed', details: 'John Smith completed deal with Prairie Grain & Agro Corp', time: '23 min ago' },
      { icon: '📊', type: 'info', title: 'Analytics Update', details: 'Conversion rate increased by 3.2% this week', time: '1 hour ago' }
    ]
  };
}

function renderMetrics(data) {
  const metricsGrid = document.getElementById('metricsGrid');
  metricsGrid.innerHTML = `
    <div class="metric-card">
      <div class="metric-label">Total Calls Today</div>
      <div class="metric-value">${data.totalCalls}</div>
      <div class="metric-change positive">↑ ${Math.floor(Math.random() * 10) + 5}% vs yesterday</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Deals Completed</div>
      <div class="metric-value">${data.dealsCompleted}</div>
      <div class="metric-change positive">↑ ${Math.floor(Math.random() * 15) + 8}% this week</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Conversion Rate</div>
      <div class="metric-value">${data.conversionRate}%</div>
      <div class="metric-change ${Math.random() > 0.5 ? 'positive' : 'negative'}">
        ${Math.random() > 0.5 ? '↑' : '↓'} ${(Math.random() * 2).toFixed(1)}% this month
      </div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Pipeline Value</div>
      <div class="metric-value">$${(data.pipelineValue / 1000).toFixed(0)}K</div>
      <div class="metric-change positive">↑ $${Math.floor(Math.random() * 50) + 20}K this month</div>
    </div>
  `;
}

function renderChart(data) {
  const chart = document.getElementById('outcomeChart');
  const maxValue = Math.max(...data.map(d => d.value));

  chart.innerHTML = data.map(item => `
    <div class="bar-group">
      <div class="bar" style="height: ${(item.value / maxValue) * 100}%; background: ${item.color};"
           title="${item.label}: ${item.value} calls">
      </div>
      <div class="bar-label">${item.label}<br><strong>${item.value}</strong></div>
    </div>
  `).join('');
}

function renderActivity(activities) {
  const feed = document.getElementById('activityFeed');
  feed.innerHTML = activities.map(item => `
    <div class="activity-item">
      <div class="activity-icon ${item.type}">${item.icon}</div>
      <div class="activity-content">
        <div class="activity-title">${item.title}</div>
        <div class="activity-details">${item.details}</div>
      </div>
      <div class="activity-time">${item.time}</div>
    </div>
  `).join('');
}

function updateDashboard() {
  const data = generateDashboardData();
  renderMetrics(data);
  renderChart(data.outcomeData);
  renderActivity(data.recentActivity);
}

// Filter button handlers
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    updateDashboard();
  });
});

// Initial render
updateDashboard();

// Auto-refresh every 30 seconds
setInterval(updateDashboard, 30000);
</script>
