<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <link rel="apple-touch-icon" href="/logo-mark.svg" />
    <script>
      // Prefer the original PNG artwork for the favicon once it exists, else keep the SVG
      (function () {
        var probe = new Image();
        probe.onload = function () {
          document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach(function (link) {
            link.href = '/logo-mark.png';
          });
        };
        probe.src = '/logo-mark.png';
      })();
    </script>
    <meta name="theme-color" content="#05070f" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concept IT Solutions · Outbound Command Center</title>
    <script>
      // Apply the saved theme before first paint so the dark default never flashes light
      (function () {
        try {
          var saved = localStorage.getItem('omnisales_theme');
          var useLight = saved !== null && JSON.parse(saved) === false;
          document.documentElement.classList.toggle('dark', !useLight);
        } catch (error) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
