<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Concept">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a14"/>
      <stop offset="0.5" stop-color="#0a1728"/>
      <stop offset="1" stop-color="#03060b"/>
    </linearGradient>
    <linearGradient id="mstreak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a2540" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#2f7fc4" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#bfe3ff" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#2f7fc4" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0a2540" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" fill="url(#mbg)"/>

  <g fill="url(#mstreak)">
    <rect x="0" y="34" width="128" height="1.5" opacity="0.35"/>
    <rect x="0" y="42" width="128" height="1" opacity="0.5"/>
    <rect x="0" y="49" width="128" height="2" opacity="0.6"/>
    <rect x="0" y="58" width="128" height="1" opacity="0.45"/>
    <rect x="0" y="64" width="128" height="3" opacity="0.85"/>
    <rect x="0" y="72" width="128" height="1.5" opacity="0.5"/>
    <rect x="0" y="79" width="128" height="2" opacity="0.4"/>
    <rect x="0" y="88" width="128" height="1" opacity="0.3"/>
  </g>

  <text x="64" y="82" text-anchor="middle"
        font-family="'Segoe UI Light', 'Helvetica Neue', Arial, sans-serif"
        font-size="58" font-weight="200" letter-spacing="1" fill="#f2f9ff">C</text>
</svg>
